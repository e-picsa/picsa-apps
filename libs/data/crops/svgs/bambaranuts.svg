<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Subtle Trifoliate Leaf Sprig (Tucked behind pods) -->
    <path d="M 48 36 C 47 28 48 22 49 16" stroke-width="2" />
    <!-- Leaflet stems -->
    <path d="M 49 16 C 45 15 39 17 35 20" stroke-width="1.8" />
    <path d="M 49 16 C 53 15 59 17 63 20" stroke-width="1.8" />
    
    <!-- Central Leaflet -->
    <path d="M 49 16 C 44 14 43 7 49 2 C 55 7 54 14 49 16 Z" stroke-width="2" />
    <path d="M 49 16 L 49 3" stroke-width="1.2" />
    <path d="M 49 11 Q 46 9.5 45 9 M 49 11 Q 52 9.5 53 9" stroke-width="1.1" />

    <!-- Left Leaflet -->
    <path d="M 35 20 C 31 16 23 15 18 19 C 22 25 30 25 35 20 Z" stroke-width="1.9" />
    <path d="M 35 20 L 19 19" stroke-width="1.2" />

    <!-- Right Leaflet -->
    <path d="M 63 20 C 67 16 75 15 80 19 C 76 25 68 25 63 20 Z" stroke-width="1.9" />
    <path d="M 63 20 L 79 19" stroke-width="1.2" />

    <!-- Subterranean Stem / Peg connecting to pods -->
    <path d="M 48 36 C 43 35 34 38 30 42" stroke-width="2.2" />
    <path d="M 48 36 C 54 36 62 38 67 42" stroke-width="2.2" />

    <!-- Large Whole Bambara Pod (Left) -->
    <!-- Globular pod outline - cleanly trimmed where it meets foreground nuts -->
    <path d="M 30 42 
             C 38 46 39 57 36 64 
             C 34 68 32 70 30 72" stroke-width="2.4" />
    <path d="M 30 42 
             C 21 38 12 39 7 47 
             C 2 55 4 64 10 70 
             C 13 73 16 74 19 75" stroke-width="2.4" />
    <!-- Pod Beak / Point -->
    <path d="M 6 56 C 4 58 3 59 2 59" stroke-width="2" />
    <!-- Pod Shell Surface Reticulation / Wrinkles -->
    <path d="M 27 44 C 20 48 12 55 9 65" stroke-width="1.3" />
    <path d="M 14 44 Q 18 51 18 60" stroke-width="1.3" />
    <path d="M 23 46 Q 26 53 25 62" stroke-width="1.3" />

    <!-- Split Pod with Nut inside (Right) -->
    <!-- Upper open shell half (lid) -->
    <path d="M 66 43 C 68 32 77 26 87 29 C 94 32 96 41 92 48" stroke-width="2.2" />
    <path d="M 68 41 C 72 33 80 29 88 31 C 93 33 94 39 91 45" stroke-width="1.4" />
    <!-- Round nut cradled in split shell -->
    <path d="M 69 46 C 68 38 77 34 84 37 C 91 40 92 48 90 54" stroke-width="2.2" />
    <ellipse cx="80" cy="41" rx="2.5" ry="1.6" transform="rotate(-15 80 41)" stroke-width="1.5" />
    <!-- Lower shell cup half -->
    <path d="M 63 46 C 61 54 67 63 77 64 C 86 65 94 60 93 51 C 92 46 88 44 84 45" stroke-width="2.4" />
    <path d="M 65 48 C 64 56 69 61 78 62 C 85 63 91 58 90 51" stroke-width="1.4" />

    <!-- Foreground Nut 3 (Left, partially resting under Pod 1 & Nut 1) -->
    <path d="M 19 75 C 13.5 78 12 85 16 90 C 20.5 94.5 27.5 94 31 89.5 C 33 87 34 84.5 34 82" stroke-width="2.2" />
    <ellipse cx="21" cy="84" rx="2.4" ry="1.5" transform="rotate(25 21 84)" stroke-width="1.5" />

    <!-- Foreground Nut 1 (Hero Bambara Roundnut - Center Front, Large & Proud) -->
    <!-- Perfectly spherical nut, 26px diameter -->
    <circle cx="46" cy="79" r="13" stroke-width="2.6" />
    <!-- Signature Bambara Hilum ("Eye") with white halo and central slit -->
    <!-- Outer halo ring -->
    <path d="M 47 70 C 53 67 58 71 57 76 C 56 81 50 82 46 78 C 43 75 43 72 47 70 Z" stroke-width="1.6" />
    <!-- Inner white eye / hilum scar -->
    <ellipse cx="50.5" cy="74.5" rx="3.8" ry="2.3" transform="rotate(-20 50.5 74.5)" stroke-width="2" />
    <!-- Central micropyle slit -->
    <path d="M 48.5 75 L 52.5 73.8" stroke-width="1.5" />
    <!-- Specular light curvature mark -->
    <path d="M 38 84 A 9 9 0 0 0 46 89" stroke-width="1.4" />

    <!-- Foreground Nut 2 (Front Right, resting beside Hero Nut) -->
    <!-- Round spherical nut in 3/4 view, 22px diameter -->
    <circle cx="71" cy="80" r="11" stroke-width="2.5" />
    <!-- Eye visible on the flank -->
    <ellipse cx="65.5" cy="77.5" rx="3" ry="1.9" transform="rotate(35 65.5 77.5)" stroke-width="1.8" />
    <path d="M 64.2 78.4 L 66.8 76.6" stroke-width="1.4" />
    <!-- Specular light curve -->
    <path d="M 74 73 C 78 77 78 84 75 88" stroke-width="1.4" />
  </g>
</svg>
