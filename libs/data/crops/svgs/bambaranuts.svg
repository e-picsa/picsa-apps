<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Plant Petiole (Stem to Trifoliate Leaf) -->
    <path d="M 49 48 C 48 40 48.5 33 49 27" stroke-width="2.2" />
    <!-- Stem branch to pod -->
    <path d="M 49 48 C 44 47 38 49 35 53" stroke-width="2" />
    
    <!-- Central Leaflet -->
    <path d="M 49 27 C 43 24 42 15 48.5 6 C 55 15 54 24 49 27 Z" stroke-width="2.2" />
    <path d="M 48.8 27 L 48.8 7" stroke-width="1.4" />
    <path d="M 48.8 21 Q 45 19 44 18 M 48.8 21 Q 52 19 53 18" stroke-width="1.2" />
    <path d="M 48.8 15 Q 45 13 44 12 M 48.8 15 Q 52 13 53 12" stroke-width="1.2" />

    <!-- Left Leaflet -->
    <path d="M 48 27 C 42 29 31 29 23 19 C 29 12 40 18 48 27 Z" stroke-width="2.2" />
    <path d="M 48 27 L 24 19" stroke-width="1.4" />
    <path d="M 41 25 Q 37 21 36 20 M 42 25 Q 40 27 38 28" stroke-width="1.2" />
    <path d="M 34 22 Q 30 18 29 17 M 35 23 Q 33 25 31 26" stroke-width="1.2" />

    <!-- Right Leaflet -->
    <path d="M 50 27 C 56 29 67 29 75 19 C 69 12 58 18 50 27 Z" stroke-width="2.2" />
    <path d="M 50 27 L 74 19" stroke-width="1.4" />
    <path d="M 57 25 Q 61 21 62 20 M 56 25 Q 58 27 60 28" stroke-width="1.2" />
    <path d="M 64 22 Q 68 18 69 17 M 63 23 Q 65 25 67 26" stroke-width="1.2" />

    <!-- Whole Bambara Pod (Left) -->
    <!-- Round, globular subterranean pod - neatly contoured to meet foreground nuts -->
    <path d="M 35 53 
             C 41 57 41 66 38 71 
             C 36.5 73.5 35 75 33.5 76" stroke-width="2.4" />
    <path d="M 35 53 
             C 29 49 20 48 14 52 
             C 8 56 6 64 11 71 
             C 14 74.5 17 76.5 20.5 77.5" stroke-width="2.4" />
    <!-- Pod Beak / Point -->
    <path d="M 10 70 C 8 71.5 6 71.5 5 71" stroke-width="2" />
    <!-- Pod Surface Wrinkles & Suture Line -->
    <path d="M 33 54 C 27 58 19 63 11 70" stroke-width="1.3" />
    <path d="M 18 53 Q 22 59 23 66" stroke-width="1.3" />
    <path d="M 27 54 Q 29 61 29 68" stroke-width="1.3" />

    <!-- Open/Split Pod (Right) -->
    <!-- Upper open shell lid -->
    <path d="M 59 51 C 60 41 68 34 78 36 C 86 38 88 46 85 52" stroke-width="2.2" />
    <path d="M 61 49 C 64 42 71 38 78 39 C 84 40 85 45 83 50" stroke-width="1.4" />
    <!-- Round Nut resting inside split pod -->
    <path d="M 62 52 C 61 45 69 41 76 43 C 82 45 84 52 82 57" stroke-width="2.2" />
    <ellipse cx="73" cy="47" rx="2" ry="1.3" transform="rotate(-15 73 47)" stroke-width="1.4" />
    <!-- Lower shell cup half -->
    <path d="M 56 53 C 55 60 61 69 70 70 C 79 71 87 67 86 58 C 85 53 81 51 77 52" stroke-width="2.4" />
    <path d="M 58 55 C 57 62 62 67 71 68 C 78 69 84 65 83 58" stroke-width="1.4" />

    <!-- Foreground Nut 3 (Back-Left) -->
    <path d="M 20.5 77.5 C 16.5 80.5 16 86.5 19.5 89.5 C 23.5 93 29 92.5 32 88.5 C 33.5 86.5 34 84.5 34 82.5" stroke-width="2.2" />
    <ellipse cx="24" cy="85.5" rx="2.2" ry="1.4" transform="rotate(20 24 85.5)" stroke-width="1.5" />

    <!-- Foreground Nut 1 (Hero Bambara Roundnut - Center Front) -->
    <circle cx="45" cy="80" r="11.5" stroke-width="2.5" />
    <!-- Iconic Bambara Oval Hilum ("Eye") with halo ring and central slit -->
    <!-- Outer halo ring -->
    <path d="M 46 72 C 51 70 55 73 54 77 C 53 81 48 82 45 79 C 43 76 43 73 46 72 Z" stroke-width="1.5" />
    <!-- Inner white eye / hilum scar -->
    <ellipse cx="49" cy="76" rx="3.2" ry="2" transform="rotate(-20 49 76)" stroke-width="1.8" />
    <!-- Central micropyle slit -->
    <path d="M 47.5 76.5 L 50.5 75.5" stroke-width="1.4" />
    <!-- Subtle specular contour line -->
    <path d="M 38 85 A 8 8 0 0 0 46 89" stroke-width="1.3" />

    <!-- Foreground Nut 2 (Front Right, resting beside Nut 1) -->
    <circle cx="67" cy="82" r="9.5" stroke-width="2.4" />
    <!-- Hilum eye in three-quarter view -->
    <ellipse cx="62.5" cy="80" rx="2.6" ry="1.6" transform="rotate(35 62.5 80)" stroke-width="1.7" />
    <path d="M 61.5 80.7 L 63.5 79.3" stroke-width="1.3" />
    <!-- Subtle specular contour line -->
    <path d="M 71 76 C 74 79 74 85 72 88" stroke-width="1.3" />
  </g>
</svg>
