<!-- Dashboard dropzone -->
@if (uppy(); as uppyInstance) {
  <uppy-dashboard [uppy]="uppyInstance" [props]="dashboardOptions()" />
  @if (maxFileSizeMB()) {
    <p class="upload-hint">Maximum file size: {{ maxFileSizeMB() }} MB</p>
  }
}

<!-- Storage path editor -->
@if (storageFolderPathEditable()) {
  <mat-form-field floatLabel="always" style="width: 100%; margin-top: 1rem">
    <mat-label>Storage Folder</mat-label>
    <input matInput type="text" [ngModel]="storageFolderPath()" (ngModelChange)="storageFolderPath.set($event)" />
    @if (storageFolderPath()) {
      <button matSuffix matIconButton aria-label="Clear" (click)="storageFolderPath.set('')">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
}

<!-- Upload button -->
@if (!autoUpload() && !hideUploadButton()) {
  <button
    matButton="outlined"
    color="primary"
    [disabled]="dashboardOptions().disabled"
    (click)="startUpload()"
    style="margin-top: 1rem"
  >
    <mat-icon>upload</mat-icon>Upload
  </button>
}
