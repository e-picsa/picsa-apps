<div class="dialog-container">
  <!-- Toolbar Section -->
  <div class="tool-buttons">
    <!-- Tool Toggle Group -->
    <mat-button-toggle-group
      [value]="tool()"
      (change)="tool.set($event.value)"
      [hideSingleSelectionIndicator]="true"
      aria-label="Annotation tools"
    >
      <mat-button-toggle value="pen">{{ 'Pen' | translate }}</mat-button-toggle>

      <mat-button-toggle value="highlighter">{{ 'Highlighter' | translate }}</mat-button-toggle>

      <mat-button-toggle value="eraser">{{ 'Eraser' | translate }}</mat-button-toggle>
    </mat-button-toggle-group>

    <!-- Color Palette Swatches -->
    <div class="color-swatches">
      @for (swatch of colorSwatches; track swatch) {
        <button
          type="button"
          class="color-swatch"
          [class.active]="tool() !== 'eraser' && color() === swatch"
          [style.background-color]="swatch"
          [disabled]="tool() === 'eraser'"
          [matTooltip]="swatch"
          (click)="color.set(swatch)"
        ></button>
      }

      <button
        type="button"
        class="color-swatch custom-swatch"
        [disabled]="tool() === 'eraser'"
        [matTooltip]="'Custom color' | translate"
        (click)="customColorInput.click()"
      ></button>

      <input
        #customColorInput
        type="color"
        class="hidden-color-input"
        [value]="color()"
        (input)="color.set($any($event.target).value)"
      />
    </div>

    <!-- Stroke/Eraser Width Dropdown Trigger -->
    <button matButton="outlined" [matMenuTriggerFor]="widthMenu" class="width-trigger">
      <span class="width-dot" [style.width.px]="strokeWidth()" [style.height.px]="strokeWidth()"></span>
      <mat-icon iconPositionEnd>expand_more</mat-icon>
    </button>

    <mat-menu #widthMenu="matMenu">
      @for (width of widthPresets; track width) {
        <button mat-menu-item class="width-option" (click)="strokeWidth.set(width)">
          <span class="width-dot" [style.width.px]="width" [style.height.px]="width"></span>
        </button>
      }
    </mat-menu>
  </div>

  <!-- Action Row -->
  <div class="edit-buttons">
    <button matButton="outlined" (click)="undoSvgStroke()">
      <mat-icon>undo</mat-icon>
      <span>{{ 'Undo' | translate }}</span>
    </button>

    <button matButton="outlined" (click)="redoSvgStroke()">
      <mat-icon>redo</mat-icon>
      <span>{{ 'Redo' | translate }}</span>
    </button>

    <button matButton="outlined" color="warn" class="margin-left-auto" (click)="clearDraw()">
      <span>{{ 'Clear All' | translate }}</span>
    </button>
  </div>

  <!-- SVG Drawing Canvas Container -->
  <div class="svg-container" [style.width.px]="size()" [style.height.px]="size()" [style.cursor]="canvasCursor()">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      [attr.viewBox]="viewbox()"
      [attr.height]="size()"
      [attr.width]="size()"
      #svgElement
      (pointerdown)="handlePointerDown($event)"
      (pointermove)="handlePointerMove($event)"
      (mouseup)="handlePointerUp()"
      (pointerup)="handlePointerUp()"
    >
      <!-- Previously rendered segments -->
      @for (segment of segments; track segment.id) {
        <path
          [attr.d]="segment.path()"
          [id]="segment.id"
          [attr.fill]="segment.color"
          [attr.opacity]="segment.tool === 'highlighter' ? 0.4 : 1"
          [style.mix-blend-mode]="segment.tool === 'highlighter' ? 'multiply' : null"
        />
      }

      <!-- Active segment -->
      @if (activeSegment.path()) {
        <path
          [attr.d]="activeSegment.path()"
          [id]="activeSegment.id"
          [attr.fill]="activeSegment.color"
          [attr.opacity]="activeSegment.tool === 'highlighter' ? 0.4 : 1"
          [style.mix-blend-mode]="activeSegment.tool === 'highlighter' ? 'multiply' : null"
        />
      }
    </svg>

    <!-- Draw Prompt Overlay -->
    @if (segments.length === 0 && !activeSegment.path()) {
      <div class="draw-logo">
        <mat-icon>draw</mat-icon>
        <div>{{ 'Draw Here' | translate }}</div>
      </div>
    }
  </div>
</div>
