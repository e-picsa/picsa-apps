@if (open()) {
  <div class="fixed inset-0 z-[1000] bg-black/50 backdrop-blur-[2px] flex items-center justify-center p-4">
    <div
      class="bg-white rounded-xl shadow-[0_20px_25px_-5px_rgba(0,0,0,0.25)] max-w-[480px] w-full p-6 max-h-[90vh] overflow-y-auto"
    >
      <div class="flex items-center gap-2">
        <mat-icon color="primary">place</mat-icon>
        <h2 class="text-xl font-semibold m-0">{{ title() | translate }}</h2>
      </div>
      <p class="text-sm text-slate-600 mt-1 mb-4">{{ subtitle() | translate }}</p>

      <picsa-form-location-select
        class="block w-full [&_.flex]:flex-col [&_.flex]:gap-2 [&_.mat-mdc-form-field]:w-full"
        [countryCode]="countryCode()"
        [value]="tempLocation() || value()"
        [locationModifier]="locationModifier()"
        (valueChanged)="handleTempLocationUpdate($event)"
      ></picsa-form-location-select>

      <div class="flex justify-end gap-3 mt-4">
        @if (allowCancel()) {
          <button matButton (click)="handleCancel()">{{ 'Cancel' | translate }}</button>
        }
        <button matButton="filled" color="primary" [disabled]="!isTempLocationReady()" (click)="handleConfirm()">
          {{ 'Confirm' | translate }}
        </button>
      </div>
    </div>
  </div>
}
