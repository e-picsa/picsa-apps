<div class="flex gap-4">
  @for (row of layerRows(); track row.layer.key) {
    <mat-form-field>
      <mat-label>{{ row.layer.label }}</mat-label>
      <mat-select
        #layerSelect
        [disabled]="row.disabled"
        (selectionChange)="onLayerSelectionChange(row.index, layerSelect.value)"
        [value]="row.selectedId"
      >
        @for (option of row.options; track option.id) {
          <mat-option [value]="option.id">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
</div>
