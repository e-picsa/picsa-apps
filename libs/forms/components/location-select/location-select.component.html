<div class="flex gap-4 my-4">
  <!-- Parent Tier Location Select (e.g. Province in multi-tier, District in single-tier) -->
  @if (locationData().admin_4; as data) {
    <mat-form-field>
      <mat-label>{{ data.label }}</mat-label>
      <mat-select #parentSelect (selectionChange)="parentSelected.set(parentSelect.value)" [value]="parentSelected()">
        @for (option of data.locations; track option.id) {
          <mat-option [value]="option.id">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }

  <!-- Deepest Sub-location Tier Select (e.g. District in ZM [admin 5] or ZW [admin 6]) -->
  @if (sublocation(); as data) {
    <mat-form-field>
      <mat-label>{{ data.label }}</mat-label>
      <mat-select
        [disabled]="!parentSelected()"
        #sublocationSelect
        (selectionChange)="sublocationSelected.set(sublocationSelect.value)"
        [value]="sublocationSelected()"
      >
        @for (option of sublocationOptions(); track option.id) {
          <mat-option [value]="option.id">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
</div>
