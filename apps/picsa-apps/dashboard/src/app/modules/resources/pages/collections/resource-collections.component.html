<div class="page-content">
  <div class="flex items-center gap-3">
    <h2 class="m-0">Resource Collections</h2>
    @if (activeCountry()) {
      <mat-chip-set>
        <mat-chip>{{ activeCountry() }}</mat-chip>
      </mat-chip-set>
    }
    <button *roleRequired="'resources.editor'" matButton="outlined" color="primary" routerLink="create" class="ml-auto">
      <mat-icon>add</mat-icon>
      Add Collection
    </button>
  </div>
  <p>Top-level collections shown to farmers and extension workers in the mobile app.</p>

  <picsa-data-table
    [data]="collections()"
    [options]="tableOptions"
    [valueTemplates]="{
      cover_image: coverImageTemplate,
      resource_files: resourceFilesTemplate,
      resource_links: resourceLinksTemplate,
      modified_at: modifiedAtTemplate,
    }"
  >
    <!-- Cover Image -->
    <ng-template #coverImageTemplate let-coverImage let-row="row">
      @if (coverImage) {
        <img
          class="w-11 h-11 object-contain block rounded"
          [src]="coverImage | storagePath"
          [alt]="row?.title || 'Collection cover'"
        />
      }
    </ng-template>

    <!-- Files Count: plain number -->
    <ng-template #resourceFilesTemplate let-files let-row="row">
      {{ row.files_count }}
    </ng-template>

    <!-- Links Count: plain number -->
    <ng-template #resourceLinksTemplate let-links let-row="row">
      {{ row.links_count }}
    </ng-template>

    <!-- Modified Date -->
    <ng-template #modifiedAtTemplate let-date>
      {{ date | date: 'mediumDate' }}
    </ng-template>
  </picsa-data-table>
</div>
