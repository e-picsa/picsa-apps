<h2 mat-dialog-title>Set climate station</h2>
<mat-dialog-content>
  <p class="text-sm text-gray-600 mb-2">Station linked to location {{ data.locationId }}</p>
  <dashboard-crop-linked-station-select
    [locationId]="data.locationId"
    [downscaledData]="data.downscaledRow"
    (stationSelected)="handleStationSelected($event)"
  ></dashboard-crop-linked-station-select>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton="outlined" (click)="close()">Close</button>
</mat-dialog-actions>
