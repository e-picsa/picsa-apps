<div class="flex flex-col max-h-[90vh] w-full bg-white text-zinc-900 overflow-hidden">
  <!-- Dialog Header -->
  <div class="flex justify-between items-center px-6 py-4 border-b border-gray-200 bg-gray-50">
    <div class="flex items-center gap-3">
      <h2 class="m-0 text-xl font-semibold text-slate-900">{{ data.station.station_name }}</h2>
      <span class="font-mono text-xs text-gray-500 bg-gray-200 px-2 py-0.5 rounded">
        {{ data.station.station_id }}
      </span>
    </div>
    <button matIconButton mat-dialog-close aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Loading Bar -->
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <!-- Dialog Body Tabs -->
  <div class="flex-1 overflow-y-auto p-4 sm:p-6">
    <mat-tab-group preserveContent animationDuration="150ms">
      <!-- Location Summary -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5">
            <mat-icon class="!text-lg !w-4 !h-4">place</mat-icon>
            <span>Location</span>
          </div>
        </ng-template>
        <div class="pt-4 max-w-xl">
          <dashboard-climate-location-summary [station]="data.station"></dashboard-climate-location-summary>
        </div>
      </mat-tab>

      <!-- Data Summary -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5">
            <mat-icon class="!text-lg !w-4 !h-4">view_list</mat-icon>
            <span>Data</span>
          </div>
        </ng-template>
        <div class="pt-4">
          <dashboard-climate-data-summary
            [station]="data.station"
            [data]="stationData()"
          ></dashboard-climate-data-summary>
        </div>
      </mat-tab>

      <!-- Charts -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5">
            <mat-icon class="!text-lg !w-4 !h-4">show_chart</mat-icon>
            <span>Charts</span>
          </div>
        </ng-template>
        <div class="pt-4">
          <dashboard-climate-chart-summary
            [station]="data.station"
            [data]="stationData()"
          ></dashboard-climate-chart-summary>
        </div>
      </mat-tab>

      <!-- Crop Probabilities -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-1.5">
            <mat-icon class="!text-lg !w-4 !h-4">percent</mat-icon>
            <span>Crop Probabilities</span>
          </div>
        </ng-template>
        <div class="pt-4">
          <dashboard-climate-crop-probabilities
            [data]="stationData()?.crop_probability_data"
          ></dashboard-climate-crop-probabilities>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
