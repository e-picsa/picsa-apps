<div class="page-content">
  <!-- Language Select -->
  <mat-form-field>
    <mat-label>Language</mat-label>
    <mat-select [(ngModel)]="locale">
      @for(locale of localeOptions(); track locale.id){
      <mat-option [value]="locale.id">{{locale.language_label}}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <!-- Headline filter chips -->
  <mat-chip-listbox (change)="tableFilter.set($event.value)" class="mb-4">
    <mat-chip-option value="all" [selected]="tableFilter() === 'all'">
      <mat-icon matChipAvatar>list</mat-icon>
      Total: {{ countTotal }}
    </mat-chip-option>
    <mat-chip-option value="translated" [selected]="tableFilter() === 'translated'" class="chip-translated">
      <mat-icon matChipAvatar>check_circle</mat-icon>
      Translated: {{ countTranslated }}
    </mat-chip-option>
    <mat-chip-option value="pending" [selected]="tableFilter() === 'pending'" class="chip-pending">
      <mat-icon matChipAvatar>translate</mat-icon>
      Needs Translation: {{ countPending }}
    </mat-chip-option>
  </mat-chip-listbox>

  <!-- Table -->
  @if(tableOptions() && countTotal>0){
  <picsa-data-table [data]="tableData()" [options]="tableOptions()" [valueTemplates]="{created_at}">
    <ng-template #created_at let-value> {{value | date: 'mediumDate' }} </ng-template>
  </picsa-data-table>
  } @else {
  <picsa-loading style="margin: auto"></picsa-loading>
  }

  <!-- JSON Export -->
  <button style="margin-top: 2rem; max-width: 200px" matButton (click)="service.exportJson(locale(),true)">
    Export JSON
  </button>
</div>
