@if (stepTitle(); as title) {
  <mat-card-title class="step-title">
    <span class="flex-1">{{ title }}</span>
    <button
      matIconButton
      class="share-btn text-white"
      (click)="shareActiveVideo($event)"
      [attr.aria-label]="'Share video' | translate"
    >
      <mat-icon>share</mat-icon>
    </button>
  </mat-card-title>
}

<div class="flex-1 flex flex-col">
  <!-- Playlist View  -->
  @if (viewMode() === 'playlist') {
    <mat-list class="playlist-container">
      @for (video of videosWithRankedChildren(); track video.id) {
        <div class="playlist-item" (click)="player.handleItemClick($event)">
          <farmer-step-video-player class="w-48" [video]="video" #player></farmer-step-video-player>
          <h3 class="flex-1 ml-4">{{ video.title }}</h3>
          <button
            matIconButton
            class="share-item-btn mr-2"
            (click)="sharePlaylistItem($event, player)"
            [attr.aria-label]="'Share video' | translate"
          >
            <mat-icon>share</mat-icon>
          </button>
        </div>
        @if (!$last) {
          <mat-divider></mat-divider>
        }
      }
    </mat-list>
  }
  <!-- Single View  -->
  @else {
    @if (videosWithRankedChildren()[0]; as video) {
      <farmer-step-video-player [video]="video" #singlePlayer></farmer-step-video-player>
    }
  }
</div>
