@if (downloadStatus(); as status) {
  @if (status === 'ready' || status === 'error') {
    <button matIconButton (click)="download($event)" [attr.data-style-variant]="styleVariant" [attr.aria-label]="'Download' | translate">
      @if (showSize) {
        <div class="download-button-inner">
          <mat-icon style="font-size: 30px; width: 30px">download</mat-icon>
          <span class="resource-size"> {{ resource().size_kb | sizeMB }} MB </span>
        </div>
      } @else {
        <mat-icon color="primary">download</mat-icon>
      }
    </button>
  }
  <!-- Pending -->
  @if (status === 'pending') {
    <div
      class="download-progress"
      [style.--spinner-size]="sizePx"
      [style.width]="sizePx"
      [style.height]="sizePx"
    >
      <mat-progress-spinner
        [class]="'spinner' + styleVariant"
        color="primary"
        [mode]="downloadProgress() > 0 ? 'determinate' : 'indeterminate'"
        [value]="downloadProgress()"
        [diameter]="size"
        [style.width]="sizePx"
        [style.height]="sizePx"
        [attr.data-style-variant]="styleVariant"
      >
      </mat-progress-spinner>
      <button
        matIconButton
        class="download-cancel"
        (click)="cancelDownload($event)"
        [disabled]="downloadProgress() === 100"
        [attr.data-style-variant]="styleVariant"
        [attr.aria-label]="'Cancel download' | translate"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
  <!-- Finalizing (write to disk) -->
  @if (status === 'finalizing') {
    <button matIconButton [attr.data-style-variant]="styleVariant" [attr.aria-label]="'Saving' | translate">
      <mat-icon>pending</mat-icon>
    </button>
  }

  <!-- Complete -->
  @if (status === 'complete') {
    <div
      class="download-complete-indicator"
      [attr.data-style-variant]="styleVariant"
      [attr.title]="'Downloaded' | translate"
    >
      <mat-icon class="download-complete-icon">check_circle</mat-icon>
    </div>
  }
}
