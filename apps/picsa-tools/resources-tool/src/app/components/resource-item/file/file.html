<div class="resource-file-card-wrapper">
  @if (fileUri(); as uri) {
    @if (dbDoc(); as doc) {
      <resource-share class="share-link" [doc]="doc"></resource-share>
    }
  }

  @switch (resource().subtype) {
    @case ('video') {
      <resource-item-video [resource]="resource()" [fileURI]="fileUri()"></resource-item-video>
    }
    @default {
      <resource-item-link
        [resource]="resourceLink()"
        (click)="handleFileLinkClick()"
        class="file-card-link"
      >
        <div card-action class="file-action-container" (click)="$event.stopImmediatePropagation()">
          <resource-download
            #dl
            [resource]="resource()"
            [size]="32"
            [showSize]="false"
            styleVariant="primary"
            (downloadStatusChange)="handleDownloadStatusChange(dl)"
          ></resource-download>
        </div>
      </resource-item-link>
    }
  }
</div>
