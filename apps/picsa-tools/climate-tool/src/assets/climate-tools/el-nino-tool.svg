<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   style="overflow:hidden">
  <!-- Background subtle container / canvas -->
  <rect x="0" y="0" width="128" height="128" fill="none"/>
  
  <!-- Red/Orange Triangle (El Niño: #d4802b) -->
  <polygon points="40,24 16,68 64,68" fill="#d4802b" stroke="#b86b1f" stroke-width="3" stroke-linejoin="round"/>

  <!-- Blue Square (La Niña: #13599e) -->
