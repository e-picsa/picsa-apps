<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   style="overflow:hidden">
  <!-- Canvas background -->
  <rect x="0" y="0" width="128" height="128" fill="none"/>

  <!-- Horizontal chart series line through the middle -->
  <line x1="14" y1="64" x2="114" y2="64" stroke="#757575" stroke-width="4" stroke-linecap="round"/>

  <!-- Neutral data points on the line -->
  <circle cx="26" cy="64" r="6" fill="#9e9e9e"/>
  <circle cx="102" cy="64" r="6" fill="#9e9e9e"/>

  <!-- La Niña highlighted point: Blue Square centered on the line -->
  <rect x="40" y="40" width="48" height="48" rx="4" fill="#13599e" stroke="#0d4277" stroke-width="3.5"/>
</svg>
