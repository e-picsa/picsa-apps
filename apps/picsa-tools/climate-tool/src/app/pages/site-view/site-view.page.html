<ng-template #headerPortal>
  <div class="site-header-portal">
    <mat-select
      #select
      [value]="chartService.station()?.id"
      (selectionChange)="handleStationSelect($event.value)"
      class="station-select-overlay"
    >
      @for(option of stationSelectOptions(); track option.value){
      <mat-option [value]="option.value" [class.opacity-50]="option.draft">{{ option.label }}</mat-option>
      }
    </mat-select>
    <button matButton color="primary" (click)="select.open()" class="station-select">
      @if(chartService.station(); as station){
      <span class="station-select-label">
        @if(districtLabel(); as district){ {{ district }}: } {{ station.name }}
      </span>
      }
      <mat-icon iconPositionEnd>expand_more</mat-icon>
    </button>
    <button matButton color="primary" (click)="goToSiteSelect()" class="map-button !hidden sm:!inline-flex">
      <mat-icon>place</mat-icon>
      <span>{{ 'Location' | translate }}</span>
    </button>
  </div>
</ng-template>

<div class="h-full w-full flex overflow-hidden">
  <picsa-sidenav-layout
    class="flex-1 overflow-hidden"
    drawerPosition="end"
    [drawerOpen]="chartService.drawerOpen()"
    (drawerOpenChange)="chartService.drawerOpen.set($event)"
  >
    <!-- Left: Main Chart Area -->
    <picsa-climate-chart-layout class="flex-1 w-full h-full" mainContent> </picsa-climate-chart-layout>

    <!-- Right: Options/Tools Drawer -->
    <picsa-climate-chart-options drawerContent></picsa-climate-chart-options>
  </picsa-sidenav-layout>

  <picsa-climate-print-layout></picsa-climate-print-layout>
</div>
