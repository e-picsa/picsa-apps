<div
  class="station-card bg-white rounded-2xl border border-gray-200/80 shadow-lg sm:rounded-xl sm:border-gray-200 sm:shadow-sm p-3.5 sm:p-4"
>
  <!-- Top header row: Category badge (NO distance) -->
  <div class="flex items-center gap-1.5 min-w-0 mb-1.5">
    <mat-icon svgIcon="climate_station" class="text-primary !w-4 !h-4 text-[16px] shrink-0"></mat-icon>
    <span class="text-xs font-semibold uppercase tracking-wider text-gray-500 truncate mt-1">
      {{ strings.climateStation | translate }}
    </span>
  </div>

  <!-- Stations list & All Stations dialog trigger -->
  <div class="pt-2 border-t border-gray-100">
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar sm:flex-wrap">
      @for (alt of nearbyStations(); track alt.station.id) {
        @let isSelected = displayedStation()?.station?.id === alt.station.id;
        <button
          matButton="outlined"
          class="!h-auto !py-1.5 !px-3 rounded-lg transition-colors shrink-0 text-left"
          [ngClass]="{
            '!border-primary !bg-primary/10 !text-primary font-semibold shadow-xs': isSelected,
            'hover:bg-gray-50 text-gray-700 border-gray-200': !isSelected,
          }"
          (click)="selectAlternate.emit(alt)"
        >
          <span class="text-xs whitespace-nowrap">
            @if (alt.mapNumber) {
              <span class="font-bold">{{ alt.mapNumber }}. </span>
            }
            {{ alt.station.name }}
          </span>
        </button>
      }

      <!-- Additional button after the list of 4 station options to open all stations dialog -->
      <button
        matButton="outlined"
        class="!h-auto !py-1.5 !px-3 rounded-lg transition-colors shrink-0 text-gray-600 border-dashed border-gray-300 hover:border-gray-400 hover:bg-gray-50 flex items-center gap-1"
        (click)="openAllStations.emit()"
      >
        <mat-icon class="!w-3.5 !h-3.5 text-[14px]">list</mat-icon>
        <span class="text-xs whitespace-nowrap">{{ strings.allStations | translate }}</span>
      </button>
    </div>
  </div>

  <!-- View Station button below the Stations list -->
  @if (displayedStation()?.station; as station) {
    <div class="mt-3">
      <button
        matButton="filled"
        color="primary"
        class="w-full !h-10 !px-4 shrink-0 whitespace-nowrap !rounded-xl flex items-center justify-center gap-2"
        (click)="confirm.emit(station)"
      >
        <span class="truncate">{{ strings.viewStation | translate: { station: station.name } }}</span>
        <mat-icon iconPositionEnd>arrow_forward</mat-icon>
      </button>
    </div>
  }
</div>
