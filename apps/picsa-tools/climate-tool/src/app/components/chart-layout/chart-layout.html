<!-- line tool -->
@if (toolService.activeTool() === 'line') {
<climate-line-tool #lineTool></climate-line-tool>
}
<!-- chart -->
<picsa-chart #picsaChart [config]="chartService.chartConfig() || {}"></picsa-chart>
<!-- definition -->
<div class="chart-definition">{{definition().definition | translate}}</div>
<!-- probability tool -->
@if (toolService.activeTool() === 'line') {
<climate-probability-tool
  style="height: 140px"
  [lineValue]="$any(toolService.tools().line.value)"
  [values]="chartService.chartSeriesData()"
  [chartName]="definition().name"
></climate-probability-tool>
}
<!-- terciles tool -->
@if (toolService.activeTool() === 'terciles') {
<climate-terciles-tool [values]="chartService.chartSeriesData()"></climate-terciles-tool>
}
<!-- el nino tool -->
@if (toolService.activeTool() === 'el_nino') {
<climate-el-nino-tool></climate-el-nino-tool>
}
<!-- la nina tool -->
@if (toolService.activeTool() === 'la_nina') {
<climate-la-nina-tool></climate-la-nina-tool>
}
