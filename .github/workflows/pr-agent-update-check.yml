name: PR Agent Update Check

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check_updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Check for model updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/pr-agent-update-check.mjs --output-github

      - name: Create Pull Request
        id: create_pr
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.check.outputs.pr_title }}
          body: ${{ steps.check.outputs.pr_body }}
          commit-message: ${{ steps.check.outputs.pr_title }}
          labels: |
            dependencies
            maintenance
          delete-branch: true

      - name: Comment with PR-Agent action update recommendation
        if: >-
          steps.check.outputs.action_update_available == 'true' &&
          steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          ACTION_NOTE: ${{ steps.check.outputs.action_note }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          marker='<!-- pr-agent-sha-update -->'
          edit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/edit/${DEFAULT_BRANCH}/.github/workflows/pr-agent.yml"
          comment_body=$(printf '%s\n\n%s\n\n[Edit the workflow file on GitHub](%s) to update the pinned action, then create a PR.' "$marker" "$ACTION_NOTE" "$edit_url")
          comments_url="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"

          existing_comment_id=$(
            gh api --paginate "$comments_url" \
              --jq '.[] | select(.body | contains("<!-- pr-agent-sha-update -->")) | .id' \
              | sed -n '1p'
          )

          if [ -n "$existing_comment_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
              --method PATCH \
              -f body="$comment_body"
            echo "Updated the existing PR-Agent action recommendation comment."
          else
            gh api "$comments_url" \
              --method POST \
              -f body="$comment_body"
            echo "Posted a PR-Agent action recommendation comment."
          fi