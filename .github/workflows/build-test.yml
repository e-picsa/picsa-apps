# Ensure build and tests pass

name: Build Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Only keep one active build per ref (e.g. pr branch, push branch, triggering workflow ref)
concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # read-write token provided by secret. All other workflows will use hardcoded readonly
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Toggle to disable Nx remote cloud cache (avoids hitting Nx Cloud quota limits). Default: true
      NX_CLOUD_DISABLE_CACHE: ${{ vars.NX_CLOUD_DISABLE_CACHE || 'true' }}
      # Align standard Nx remote-cache bypass flags with NX_CLOUD_DISABLE_CACHE
      NX_NO_CLOUD: ${{ vars.NX_CLOUD_DISABLE_CACHE == 'false' && 'false' || 'true' }}
      NX_DISABLE_REMOTE_CACHE: ${{ vars.NX_CLOUD_DISABLE_CACHE == 'false' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Calculate Cache Epoch
        id: cache-epoch
        run: echo "week=$(date +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Restore Nx Cache
        uses: actions/cache/restore@v5
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-w${{ steps.cache-epoch.outputs.week }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ runner.os }}-w${{ steps.cache-epoch.outputs.week }}-${{ hashFiles('yarn.lock') }}-
            nx-cache-${{ runner.os }}-w${{ steps.cache-epoch.outputs.week }}-
            nx-cache-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "yarn"

      - name: Install node modules
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # - run: yarn nx test
      # Ensure can also build

      - name: Build
        run: yarn nx build

      # Self-repair: Evict stale (>7 days) & LRU items if .nx/cache exceeds 1.5GB (main branch only)
      - name: Prune Stale Nx Cache Entries
        if: github.ref == 'refs/heads/main'
        run: node tools/workflows/prune-nx-cache.mjs

      # Authoritative write: Save cache only on main branch merges/runs
      - name: Save Nx Cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-w${{ steps.cache-epoch.outputs.week }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
