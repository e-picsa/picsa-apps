# Ensure build and tests pass

name: Build Test
on:
  # Runs on pull requests targeting main (read-only cache restore)
  pull_request:
    branches:
      - main
  # Triggers automatically post-merge to populate/update the authoritative Nx cache on main
  push:
    branches:
      - main
  # Fallback manual trigger if cache needs an ad-hoc rebuild
  workflow_dispatch:

# Only keep one active build per ref (e.g. pr branch, push branch, triggering workflow ref)
concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # read-write token provided by secret. All other workflows will use hardcoded readonly
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Calculate Cache Epoch
        id: cache-epoch
        run: echo "week=$(date +%Y-W%V)" >> $GITHUB_OUTPUT

      # Restores .nx/cache from the latest authoritative build on main.
      # Local hits replay directly without downloading artifacts from Nx Cloud.
      - name: Restore Nx Cache
        uses: actions/cache/restore@v5
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-w${{ steps.cache-epoch.outputs.week }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ runner.os }}-w${{ steps.cache-epoch.outputs.week }}-${{ hashFiles('yarn.lock') }}-
            nx-cache-${{ runner.os }}-w${{ steps.cache-epoch.outputs.week }}-
            nx-cache-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "yarn"

      - name: Install node modules
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # - run: yarn nx test
      # Ensure can also build

      - name: Build
        run: yarn nx build

      # Self-repair: Evict stale (>7 days) & LRU items if .nx/cache exceeds 1.5GB
      # Runs only on post-merge runs on main to keep the authoritative cache trimmed.
      - name: Prune Stale Nx Cache Entries
        if: github.ref == 'refs/heads/main'
        run: node tools/workflows/prune-nx-cache.mjs

      # Authoritative write: Save cache only on post-merge runs on main so PR branches
      # read a warm cache without polluting or thrashing repository cache storage.
      - name: Save Nx Cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-w${{ steps.cache-epoch.outputs.week }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
