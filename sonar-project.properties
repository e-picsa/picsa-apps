# sonar-project.properties
sonar.projectKey=e-picsa_picsa-apps
sonar.organization=e-picsa

# Rules used
sonar.issue.ignore.multicriteria=ignoreTSS2933,ignoreGHActionsS6505,ignoreNodeS4036

# typescript:S2933 - ignore rule to force `readonly` on all injected services
sonar.issue.ignore.multicriteria.ignoreTSS2933.ruleKey=typescript:S2933
sonar.issue.ignore.multicriteria.ignoreTSS2933.resourceKey=**/*

# githubactions:S6505 - Lifecycle scripts are enabled by default in Yarn v2+
sonar.issue.ignore.multicriteria.ignoreGHActionsS6505.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.ignoreGHActionsS6505.resourceKey=.github/workflows/**

# javascript:S4036 - local agent operator scripts resolve `git`/`du` via PATH by design (matches tools/ai/_shared.mjs); PATH hijacking is not a threat model on a developer workstation
sonar.issue.ignore.multicriteria.ignoreNodeS4036.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.ignoreNodeS4036.resourceKey=tools/ai/**

# Exclude test/spec files and generated data files from duplication (CPD) checks
# NOTE - on free tier these must be manually specified in Administration -> General Settings -> Analysis Scope
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.generated.ts